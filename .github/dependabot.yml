# Keeps the toolchain from going stale between releases. One grouped pull
# request a week per ecosystem; nothing merges without review.
#
# Not covered: the Deno side (`deno.json`, `deno.lock`) and the gitleaks image
# tag in check.yml. Refresh those with `deno update` and by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      toolchain:
        patterns: ["*"]
    # The Node types follow the Node version CI runs (check.yml), so a major
    # bump of the types is a runtime decision, not a dependency update.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
